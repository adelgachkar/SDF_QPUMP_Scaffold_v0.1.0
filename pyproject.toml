[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SDF_QPUMP"
version = "0.1.0"
description = "SDF QPUMP Scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
